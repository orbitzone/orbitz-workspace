<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
 <defs>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
   <stop stop-color="#f4fbff"/><stop offset=".22" stop-color="#9fc4dc"/><stop offset=".48" stop-color="#315c7d"/><stop offset=".75" stop-color="#83b8d6"/><stop offset="1" stop-color="#142d4c"/>
  </linearGradient>
  <radialGradient id="face" cx=".35" cy=".25" r=".9">
   <stop stop-color="#174764"/><stop offset=".6" stop-color="#09263f"/><stop offset="1" stop-color="#041424"/>
  </radialGradient>
  <linearGradient id="orbit" x1="0" y1="1" x2="1" y2="0">
   <stop stop-color="#007ebc"/><stop offset=".45" stop-color="#56eeff"/><stop offset="1" stop-color="#00b9eb"/>
  </linearGradient>
  <linearGradient id="hands" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#b3d9ed"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <radialGradient id="planet" cx=".3" cy=".25"><stop stop-color="#fff"/><stop offset=".25" stop-color="#a0e8ff"/><stop offset=".65" stop-color="#2588b4"/><stop offset="1" stop-color="#06304e"/></radialGradient>
 </defs>
 <!-- Orbitz: a broad tilted orbit surrounds a compact clock. -->
 <ellipse cx="256" cy="257" rx="249" ry="100" transform="rotate(-25 256 257)" fill="none" stroke="#042b49" stroke-width="31"/>
 <ellipse cx="256" cy="257" rx="249" ry="100" transform="rotate(-25 256 257)" fill="none" stroke="url(#orbit)" stroke-width="21"/>
 <ellipse cx="256" cy="257" rx="249" ry="100" transform="rotate(-25 256 257)" fill="none" stroke="#c3ffff" stroke-width="4"/>
 <g transform="translate(256 256) scale(.78) translate(-253 -249)">
 <circle cx="253" cy="253" r="220" fill="#061729"/>
 <circle cx="253" cy="249" r="215" fill="url(#rim)" stroke="#9fcfe8" stroke-width="2"/>
 <circle cx="253" cy="249" r="197" fill="#031523" stroke="#274c69" stroke-width="4"/>
 <circle cx="253" cy="249" r="187" fill="url(#face)" stroke="#5a9abb" stroke-width="2"/>
 <g stroke="#68e6ff" stroke-width="11" stroke-linecap="round">
  <path d="M253 86v24 M253 388v24 M90 249h24 M392 249h24"/>
  <path id="tick" d="M253 91v18" transform="rotate(30 253 249)"/>
  <use href="#tick" transform="rotate(30 253 249)"/><use href="#tick" transform="rotate(90 253 249)"/><use href="#tick" transform="rotate(120 253 249)"/><use href="#tick" transform="rotate(180 253 249)"/><use href="#tick" transform="rotate(210 253 249)"/><use href="#tick" transform="rotate(270 253 249)"/><use href="#tick" transform="rotate(300 253 249)"/>
 </g>
 <g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M253 253L174 186 M253 253L356 151" stroke="#020f1d" stroke-width="24" opacity=".55"/>
  <path d="M253 249L174 182 M253 249L356 147" stroke="url(#hands)" stroke-width="16"/>
  <path d="M253 249L175 337" stroke="#ff9c35" stroke-width="6"/>
 </g>
 <circle cx="253" cy="249" r="18" fill="#ffb249" stroke="#ffda8a" stroke-width="2"/>
 <circle cx="253" cy="249" r="10" fill="#683215"/>
 </g>
 <!-- Front half of the same ellipse, separated from the clock by a dark edge. -->
 <defs><clipPath id="frontHalf"><rect x="-30" y="257" width="580" height="160"/></clipPath></defs>
 <g transform="rotate(-25 256 257)" fill="none" clip-path="url(#frontHalf)">
 <ellipse cx="256" cy="257" rx="249" ry="100" stroke="#042b49" stroke-width="31"/>
 <ellipse cx="256" cy="257" rx="249" ry="100" stroke="url(#orbit)" stroke-width="21"/>
 <ellipse cx="256" cy="257" rx="249" ry="100" stroke="#c3ffff" stroke-width="4"/>
 </g>
 <circle cx="461" cy="191" r="26" fill="url(#planet)" stroke="#9bf3ff" stroke-width="4"/>

</svg>
